version: '3.1'

services:
  
  back_db:
    platform: linux/x86_64
    image: 'postgres:14-alpine'
    container_name: back_db
    restart: on-failure
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=silomis
    volumes:
      - back_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "local-redis-password"]
    volumes:
      - redis_data:/data

volumes:
  back_db_data:
  redis_data: