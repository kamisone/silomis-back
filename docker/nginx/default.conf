upstream back {
    server 192.168.49.2;
}

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log debug;

client_max_body_size 200M;
large_client_header_buffers 4 16k;

root /var/www/html;
index index.html;

server {
    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;

    #redirect to https only when in production (file exists only in prod)
    include /etc/ssl/silomis/ssl_redirect.conf*;

    location / {
        proxy_pass http://back$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header x-next-router-prefetch $http_next_router_prefetch;
        proxy_cache_bypass $http_upgrade;
        #proxy_buffering off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The visitor's real address, under a name the k8s ingress will not touch.
        # ingress-nginx rewrites the standard X-Forwarded-* headers unless
        # `use-forwarded-headers` is enabled, which wipes the address above; custom
        # headers are passed through untouched. $remote_addr is trustworthy here
        # because this nginx is the edge — it is what the client actually connected from.
        proxy_set_header X-Original-Client-IP $remote_addr;
    }

}

server {
    # include ssl certificate only in prod (*)
    include /etc/ssl/silomis/ssl_config.conf*;
    server_name *.silomis.com;

    location / {
        proxy_pass http://back$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header x-next-router-prefetch $http_next_router_prefetch;
        proxy_cache_bypass $http_upgrade;
        #proxy_buffering off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The visitor's real address, under a name the k8s ingress will not touch.
        # ingress-nginx rewrites the standard X-Forwarded-* headers unless
        # `use-forwarded-headers` is enabled, which wipes the address above; custom
        # headers are passed through untouched. $remote_addr is trustworthy here
        # because this nginx is the edge — it is what the client actually connected from.
        proxy_set_header X-Original-Client-IP $remote_addr;
    }
}

