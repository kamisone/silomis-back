              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: SMTP_FROM
            - name: IMAP_HOST
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: IMAP_HOST
            - name: IMAP_PORT
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: IMAP_PORT
            - name: IMAP_USER
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: IMAP_USER
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: IMAP_PASSWORD
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: TURNSTILE_SECRET_KEY
            - name: META_CAPI_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: META_CAPI_ACCESS_TOKEN
            - name: META_CAPI_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: META_CAPI_API_VERSION
            - name: TIKTOK_EVENTS_API_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: back-envs
                  key: TIKTOK_EVENTS_API_ACCESS_TOKEN
            
